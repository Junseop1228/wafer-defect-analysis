name: Gate Check

on:
  push:
    paths:
      - 'src/**'
      - 'config.yaml'
  pull_request:
    branches:
      - dev
      - main

jobs:
  gate-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gate checks
        id: gates
        run: |
          python -c "
          import yaml, json, sys, os

          # Only run if features_labeled.pkl exists (skip on fresh clone)
          if not os.path.exists('data/features_labeled.pkl'):
              print('data/features_labeled.pkl not found — skipping Gate check (fresh clone)')
              sys.exit(0)

          from src.evaluate import check_gate1, check_gate2, check_gate3, check_gate4
          cfg = yaml.safe_load(open('config.yaml'))

          results = {}

          # Gate checks run only if prerequisite data exists
          # Add gates progressively as stages complete
          print('[GATE CHECK] All available gates passed or skipped.')
          " 2>&1

      - name: Post Gate results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Gate Check Results\n\nSee Actions log for details.'
            })
