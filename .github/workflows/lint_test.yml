name: Lint and Unit Tests

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config.yaml'
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # E501,E302,E701,E226,E261 제외 (ML 코드 스타일 허용)
          flake8 src/ --max-line-length=120 --ignore=E501,W503,E302,E701,E226,E261 --count --statistics

      - name: Run unit tests
        run: |
          pip install pytest
          pytest tests/ -v --tb=short

      - name: Post test results as PR comment
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## ❌ Lint / Unit Test Failed\n\nSee Actions log for details.\n\nGate 수치 체크는 로컬 실행 후 experiment_log.md 기준으로 판단.'
            })
